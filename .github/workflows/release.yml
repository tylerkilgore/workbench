name: Release

# Tag-driven: pushing v1.2.3 builds every platform and publishes one GitHub
# Release in this repository. electron-updater reads that release's feed files
# (latest.yml, latest-mac.yml), so the release *is* the update channel — there
# is no separate releases repo to keep in step.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write # Creating the Release and uploading its assets.

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      # One platform failing should not discard a good build of the other; the
      # release is assembled from whatever uploaded successfully.
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            name: macOS (arm64 + x64)
            build: npx electron-builder --mac --publish always
          - os: ubuntu-latest
            name: Linux (x64 + arm64)
            build: npx electron-builder --linux --publish always

          # Windows is not built yet, and the reason is upstream rather than
          # here: the Workbook CLI this app bundles does not compile for Windows
          # at the pinned ref. `npm run stage` would fail before packaging, so
          # enabling this row now would only turn every release red — and a
          # Windows build that skipped the CLI would install an app that cannot
          # open a single project.
          #
          # The port is three build-tagged files (flock, the socket directory's
          # privacy check, and a POSIX-only test helper). Re-enable this row once
          # the "workbook" pin in package.json names a ref that includes it.
          #
          # - os: windows-2022
          #   name: Windows (x64 + arm64)
          #   build: npx electron-builder --win --publish always

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Workbench bundles the Workbook CLI, which is built from source at the
      # ref pinned in package.json. Go is a build-time dependency only — the
      # shipped app has no Go runtime.
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: false

      - name: Install dependencies
        run: npm ci

      - name: Build and stage the Workbook CLI
        shell: bash
        run: npm run stage

      - name: Verify the staged CLI runs
        shell: bash
        run: ./build/workbook version

      # ──── Windows code signing (Azure Trusted Signing) ────
      # Signing is optional: without these secrets the build still produces
      # installers, they are simply unsigned. Mirrors the plus2win setup.
      #
      #   AZURE_TENANT_ID, AZURE_CLIENT_ID, AZURE_CLIENT_SECRET,
      #   AZURE_CODE_SIGNING_ACCOUNT, AZURE_CERTIFICATE_PROFILE, AZURE_ENDPOINT
      - name: Install Azure Trusted Signing tools
        if: runner.os == 'Windows' && env.AZURE_TENANT_ID != ''
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
        run: |
          dotnet tool install --global Azure.CodeSigning.Dlib --version 1.0.52
          $toolPath = Join-Path $env:USERPROFILE ".dotnet/tools/.store/azure.codesigning.dlib"
          $dll = Get-ChildItem -Path $toolPath -Recurse -Filter "Azure.CodeSigning.Dlib.dll" | Select-Object -First 1
          echo "AZURE_CODE_SIGNING_DLIB=$($dll.FullName)" >> $env:GITHUB_ENV

      - name: Write signing metadata
        if: runner.os == 'Windows' && env.AZURE_TENANT_ID != ''
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
        run: |
          @"
          {
            "Endpoint": "${{ secrets.AZURE_ENDPOINT }}",
            "CodeSigningAccountName": "${{ secrets.AZURE_CODE_SIGNING_ACCOUNT }}",
            "CertificateProfileName": "${{ secrets.AZURE_CERTIFICATE_PROFILE }}"
          }
          "@ | Out-File -FilePath "${{ github.workspace }}/signing-metadata.json" -Encoding utf8

      - name: Build and publish
        shell: bash
        env:
          # The default token can write releases in this repository, so no PAT
          # is needed — releases are published here, not to a separate repo.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          WINDOWS_SIGN_TOOL_PATH: ${{ env.AZURE_CODE_SIGNING_DLIB }}
          WINDOWS_SIGN_USER_OPERATION: ${{ github.workspace }}/signing-metadata.json
        run: ${{ matrix.build }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: workbench-${{ runner.os }}
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.exe
            dist/*.blockmap
            dist/latest*.yml
          if-no-files-found: error
          retention-days: 14
